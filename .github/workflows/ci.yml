name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-macos:
    runs-on: macos-latest
    steps:
      - name: 记录开始时间
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Rust 工具链身份
        run: |
          cd engine
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Rust 格式、静态检查与单测
        run: make rust-check

      - name: 构建 Rust cdylib
        run: make rust

      - name: 写入构建元数据
        run: |
          echo "$GITHUB_SHA" > engine/target/release/native-source-sha.txt
          {
            printf 'sha %s\n' "$GITHUB_SHA"
            for path in \
              engine/target/release/libmornlea_engine.dylib \
              engine/target/release/libmornlea_client.dylib; do
              printf '%s %s %s\n' \
                "$path" \
                "$(stat -f '%z' "$path")" \
                "$(shasum -a 256 "$path" | awk '{print $1}')"
            done
          } > engine/target/release/native-artifact-manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            engine/target/release/libmornlea_engine.dylib
            engine/target/release/libmornlea_client.dylib
            engine/target/release/native-source-sha.txt
            engine/target/release/native-artifact-manifest.txt

      - name: 记录 native 构建信息
        if: ${{ always() }}
        run: |
          {
            echo "native-macos seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: native-macos
    runs-on: macos-latest
    steps:
      - name: 记录开始时间
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            engine/include/mornlea_engine.h
            engine/include/mornlea_client.h
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-${{ github.sha }}
          path: engine/target/release
      - name: 校验 native artifact
        run: |
          test -f engine/target/release/libmornlea_engine.dylib
          test -f engine/target/release/libmornlea_client.dylib
          test "$(cat engine/target/release/native-source-sha.txt)" = "$GITHUB_SHA"
          test "$(wc -l < engine/target/release/native-artifact-manifest.txt | tr -d ' ')" = 3
          {
            IFS=' ' read -r kind sha extra
            test "$kind" = sha
            test "$sha" = "$GITHUB_SHA"
            test -z "$extra"
            validate_artifact() {
              expected_path=$1
              IFS=' ' read -r path size digest extra
              test "$path" = "$expected_path"
              test -z "$extra"
              case "$size" in ''|*[!0-9]*) exit 1 ;; esac
              test "$size" = "$(stat -f '%z' "$path")"
              test "$digest" = "$(shasum -a 256 "$path" | awk '{print $1}')"
            }
            validate_artifact engine/target/release/libmornlea_engine.dylib
            validate_artifact engine/target/release/libmornlea_client.dylib
          } < engine/target/release/native-artifact-manifest.txt
          mkdir -p engine/target/release/deps
          cp engine/target/release/libmornlea_engine.dylib engine/target/release/deps/
          cp engine/target/release/libmornlea_client.dylib engine/target/release/deps/
      - name: OpenSpec 规格门禁
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive
      - name: Agent Hooks 策略测试
        run: node --test scripts/agent-hooks/guard.test.mjs
      - name: 架构、存储与协议门禁
        run: go test ./internal/archcheck ./internal/storage ./internal/network ./internal/physics -v
      - name: Race 分片全集自检
        run: |
          go list ./... | sort -u > /tmp/all-packages.txt
          {
            go list ./cmd/...
            printf '%s\n' github.com/channing771/mornlea/internal/server
            go list ./internal/... | grep -v '/internal/server$'
            # scripts/ 是带 package main 的 Go 包（composite_grass_side.go 材质
            # 合成工具），go list ./... 会包含它；分片联合集必须同源覆盖，否则本
            # 自检在引入该工具后恒红。
            printf '%s\n' github.com/channing771/mornlea/scripts
          } | sort -u > /tmp/sharded-packages.txt
          diff -u /tmp/all-packages.txt /tmp/sharded-packages.txt
      - name: 静态检查
        run: |
          go vet ./...
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
      - name: 记录 quality 信息
        if: ${{ always() }}
        run: |
          {
            echo "quality seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  go-race:
    needs: native-macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cmd
            packages: ./cmd/...
            extra: -skip '^TestScenarioV7EightSessionServerProbeIsRealAndBounded$'
          - shard: internal-server
            packages: ./internal/server
            extra: ''
          - shard: internal-rest
            packages: "$(go list ./internal/... | grep -v '/internal/server$') github.com/channing771/mornlea/scripts"
            extra: ''
    steps:
      - name: 记录开始时间
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            engine/include/mornlea_engine.h
            engine/include/mornlea_client.h
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-${{ github.sha }}
          path: engine/target/release
      - name: 校验 native artifact
        run: |
          test -f engine/target/release/libmornlea_engine.dylib
          test -f engine/target/release/libmornlea_client.dylib
          test "$(cat engine/target/release/native-source-sha.txt)" = "$GITHUB_SHA"
          test "$(wc -l < engine/target/release/native-artifact-manifest.txt | tr -d ' ')" = 3
          {
            IFS=' ' read -r kind sha extra
            test "$kind" = sha
            test "$sha" = "$GITHUB_SHA"
            test -z "$extra"
            validate_artifact() {
              expected_path=$1
              IFS=' ' read -r path size digest extra
              test "$path" = "$expected_path"
              test -z "$extra"
              case "$size" in ''|*[!0-9]*) exit 1 ;; esac
              test "$size" = "$(stat -f '%z' "$path")"
              test "$digest" = "$(shasum -a 256 "$path" | awk '{print $1}')"
            }
            validate_artifact engine/target/release/libmornlea_engine.dylib
            validate_artifact engine/target/release/libmornlea_client.dylib
          } < engine/target/release/native-artifact-manifest.txt
          mkdir -p engine/target/release/deps
          cp engine/target/release/libmornlea_engine.dylib engine/target/release/deps/
          cp engine/target/release/libmornlea_client.dylib engine/target/release/deps/
      - name: Race tests
        run: go test ${{ matrix.packages }} -race -p=1 ${{ matrix.extra }}
      - name: 记录 race 分片信息
        if: ${{ always() }}
        run: |
          {
            echo "go-race ${{ matrix.shard }} seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    needs: native-macos
    runs-on: macos-latest
    steps:
      - name: 记录开始时间
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            engine/include/mornlea_engine.h
            engine/include/mornlea_client.h
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-${{ github.sha }}
          path: engine/target/release
      - name: 校验 native artifact
        run: |
          test -f engine/target/release/libmornlea_engine.dylib
          test -f engine/target/release/libmornlea_client.dylib
          test "$(cat engine/target/release/native-source-sha.txt)" = "$GITHUB_SHA"
          test "$(wc -l < engine/target/release/native-artifact-manifest.txt | tr -d ' ')" = 3
          {
            IFS=' ' read -r kind sha extra
            test "$kind" = sha
            test "$sha" = "$GITHUB_SHA"
            test -z "$extra"
            validate_artifact() {
              expected_path=$1
              IFS=' ' read -r path size digest extra
              test "$path" = "$expected_path"
              test -z "$extra"
              case "$size" in ''|*[!0-9]*) exit 1 ;; esac
              test "$size" = "$(stat -f '%z' "$path")"
              test "$digest" = "$(shasum -a 256 "$path" | awk '{print $1}')"
            }
            validate_artifact engine/target/release/libmornlea_engine.dylib
            validate_artifact engine/target/release/libmornlea_client.dylib
          } < engine/target/release/native-artifact-manifest.txt
          mkdir -p engine/target/release/deps
          cp engine/target/release/libmornlea_engine.dylib engine/target/release/deps/
          cp engine/target/release/libmornlea_client.dylib engine/target/release/deps/
      - name: 50ms 服务端探针门禁
        run: go test ./cmd/mornlea/benchmark -run '^TestScenarioV7EightSessionServerProbeIsRealAndBounded$' -count=1
      - name: TCP 重启与 Memory/TCP parity 重复门禁
        run: go test ./internal/server -run 'TestTCPPlayerAndWorld|TestMemoryTCPParity' -race -count=10
      - name: M3C v6 八玩家与性能报告门禁
        run: go test ./internal/client ./internal/server ./cmd/mornlea/benchmark ./cmd/perfcheck -run 'Test(PerfReportV6|ScenarioV6|PerfcheckV6|PerfcheckV5SameScenario|PerformanceThresholds|InterestObserver|HostStats|BenchmarkServerEpoch|BenchmarkServerMeasuredWindow)' -count=1
      - name: 微基准与平台无关阈值
        run: go test ./... -bench=. -benchtime=1x -run='^$'
      - name: M3C 多人微基准可执行性
        run: go test ./internal/network ./internal/server ./internal/render -run '^$' -bench '(RemotePlayerStateCodec|EightPlayerInterest|RemoteAvatarNameTag)' -benchmem -benchtime=100x -count=1
      - name: 记录 integration 信息
        if: ${{ always() }}
        run: |
          {
            echo "integration seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # Go 的构建缓存不追踪 cgo `#include` 进来的 C 头文件，而 setup-go 默认只用
          # go.sum 做缓存 key。engine ABI 升版只改头文件、不动 go.sum，于是缓存会命中
          # 上一个 ABI 版本编译出的 internal/nativeabi 目标文件：运行时库报新版本、
          # 编译进 Go 的常量仍是旧版本，表现为 ABI 版本不匹配，且因缓存命中有竞态而
          # 时红时绿。把头文件纳入 key，ABI 变更即强制冷编译。
          cache-dependency-path: |
            go.sum
            engine/include/mornlea_engine.h

      - name: Rust 工具链身份
        run: |
          cd engine
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: 构建并测试 native collision bundle
        run: |
          make rust
          go test ./internal/nativeabi ./internal/core ./internal/physics ./internal/mesh -race -count=1
          make build-linux-server

      - name: Linux 专服架构与 ELF 门禁
        run: |
          go test ./internal/archcheck -count=1
          test -z "$(CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go list -deps ./cmd/mornlea-server |
            grep -E 'internal/(client|mesh|render|gfx)|glfw|webgpu|x/image/font')"
          readelf -d bin/mornlea-server | grep -F 'libmornlea_engine.so'
          readelf -d bin/mornlea-server | grep -F '$ORIGIN'
          nm -D --defined-only bin/libmornlea_engine.so > /tmp/mornlea-engine-symbols.txt
          for symbol in mornlea_engine_abi_version mornlea_mesh_section mornlea_collision_resolve mornlea_raycast_batch; do
            awk '{print $NF}' /tmp/mornlea-engine-symbols.txt | grep -Fx "$symbol"
          done

      - name: 脱离 Cargo target 加载相邻 so
        run: |
          native_target_backup="$(mktemp -d)/target"
          trap 'test -e engine/target || mv "$native_target_backup" engine/target' EXIT
          mv engine/target "$native_target_backup"
          ldd bin/mornlea-server > /tmp/mornlea-server-ldd.txt
          grep -F "$(pwd)/bin/libmornlea_engine.so" /tmp/mornlea-server-ldd.txt
          set +e
          bin/mornlea-server -h >/tmp/mornlea-server-help.txt 2>&1
          native_help_rc=$?
          set -e
          mv "$native_target_backup" engine/target
          trap - EXIT
          test "$native_help_rc" -eq 1
          grep -F 'flag: help requested' /tmp/mornlea-server-help.txt
          ! grep -E 'error while loading shared libraries|cannot open shared object' /tmp/mornlea-server-help.txt

  test:
    if: ${{ always() }}
    needs: [native-macos, quality, go-race, integration, linux-server]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总全部必需门禁
        run: |
          test "${{ needs.native-macos.result }}" = success
          test "${{ needs.quality.result }}" = success
          test "${{ needs['go-race'].result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.linux-server.result }}" = success
