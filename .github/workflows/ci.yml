name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-macos:
    runs-on: macos-latest
    steps:
      - name: 记录开始时间
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Rust 工具链身份
        run: |
          cd engine
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Rust 格式、静态检查与单测
        run: make rust-check

      - name: 构建 Rust cdylib
        run: make rust

      - name: 写入构建 SHA
        run: |
          echo "$GITHUB_SHA" > engine/target/release/native-source-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            engine/target/release/libmornlea_engine.dylib
            engine/target/release/libmornlea_client.dylib
            engine/target/release/native-source-sha.txt

      - name: 记录 native 构建信息
        if: ${{ always() }}
        run: |
          {
            echo "native-macos seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # Go 的构建缓存不追踪 cgo `#include` 进来的 C 头文件，而 setup-go 默认只用
          # go.sum 做缓存 key。engine ABI 升版只改头文件、不动 go.sum，于是缓存会命中
          # 上一个 ABI 版本编译出的 internal/nativeabi 目标文件：运行时库报新版本、
          # 编译进 Go 的常量仍是旧版本，表现为 ABI 版本不匹配，且因缓存命中有竞态而
          # 时红时绿。把头文件纳入 key，ABI 变更即强制冷编译。
          cache-dependency-path: |
            go.sum
            engine/include/mornlea_engine.h

      - name: Rust 工具链身份
        run: |
          cd engine
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: 构建并测试 native collision bundle
        run: |
          make rust
          go test ./internal/nativeabi ./internal/core ./internal/physics ./internal/mesh -race -count=1
          make build-linux-server

      - name: Linux 专服架构与 ELF 门禁
        run: |
          go test ./internal/archcheck -count=1
          test -z "$(CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go list -deps ./cmd/mornlea-server |
            grep -E 'internal/(client|mesh|render|gfx)|glfw|webgpu|x/image/font')"
          readelf -d bin/mornlea-server | grep -F 'libmornlea_engine.so'
          readelf -d bin/mornlea-server | grep -F '$ORIGIN'
          nm -D --defined-only bin/libmornlea_engine.so > /tmp/mornlea-engine-symbols.txt
          for symbol in mornlea_engine_abi_version mornlea_mesh_section mornlea_collision_resolve mornlea_raycast_batch; do
            awk '{print $NF}' /tmp/mornlea-engine-symbols.txt | grep -Fx "$symbol"
          done

      - name: 脱离 Cargo target 加载相邻 so
        run: |
          native_target_backup="$(mktemp -d)/target"
          trap 'test -e engine/target || mv "$native_target_backup" engine/target' EXIT
          mv engine/target "$native_target_backup"
          ldd bin/mornlea-server > /tmp/mornlea-server-ldd.txt
          grep -F "$(pwd)/bin/libmornlea_engine.so" /tmp/mornlea-server-ldd.txt
          set +e
          bin/mornlea-server -h >/tmp/mornlea-server-help.txt 2>&1
          native_help_rc=$?
          set -e
          mv "$native_target_backup" engine/target
          trap - EXIT
          test "$native_help_rc" -eq 1
          grep -F 'flag: help requested' /tmp/mornlea-server-help.txt
          ! grep -E 'error while loading shared libraries|cannot open shared object' /tmp/mornlea-server-help.txt
