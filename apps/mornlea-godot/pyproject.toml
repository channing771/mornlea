[project]
name = "mornlea-godot"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    ".godot",
    ".venv",
    "addons",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "typing"
exclude = "(^|/)(addons|\\.godot|\\.venv)/"
