[package]
name = "mornlea_client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

# 窗口栈只在 darwin 生产;其他平台此 crate 编译为空库,Linux 专服不受影响。
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
raw-window-handle = "0.6"
objc2 = "0.6"
# 渲染器:与 Go 绑定内嵌的 wgpu-native v29 同主版本线,降低跨后端行为差异。
wgpu = "29"
# wgpu 异步初始化的最小执行器。
pollster = "0.4"
# egui 即时模式 UI 的纯布局/输入/字体生态;默认关闭 default_fonts,字体经
# client ABI v8 的一次性上传(Go embed 的 Noto CJK OTF),避免双份二进制进仓。
# egui 0.35 线声明 wgpu ^29,与仓库直接 wgpu 29 同线;0.36 线声明 wgpu ^30,
# 违反"绝不单侧升级 wgpu"裁决,故钉死 0.35。
egui = { version = "0.35", default-features = false }
# egui_wgpu 渲染器:关闭 default_features(wgpu 依赖退化为 std/wgsl),
# 只开 macos-window-resize-jitter-fix(转发 wgpu/metal)。wgpu 的 default 特性
# 由本 crate 上方直接依赖 wgpu=29(未关闭 default_features)经特性统一携带,
# 故此处不再用 Cargo 非法语法 wgpu/default 重复开启。
# 不启用 webgl/winit/capture feature;绝不引入 egui-winit(把 winit 版本
# 耦合给 egui-winit,而菜单输入翻译量很小,裁决手工 RawInput)。
egui-wgpu = { version = "0.35", default-features = false, features = ["macos-window-resize-jitter-fix"] }
