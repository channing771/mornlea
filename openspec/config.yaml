schema: spec-driven

context: |
  项目：Mornlea 是使用 Go 1.26 编写的独立体素游戏，Go module 为 `github.com/channing771/mornlea`；不兼容官方 Minecraft 协议、存档或版权资源。
  当前版本矩阵：协议 v32、玩家 schema v8、区块 schema v9、世界 metadata v3、`companions.ai` schema v5、`hostile_mobs` schema v1、engine ABI v10、client ABI v14、benchmark scenario 为 v22。
  权威边界：服务端是世界与玩家状态的唯一权威；客户端只持有镜像、预测和呈现状态。普通本地 Memory 与远程 TCP 受同一 packet/codec 契约约束，并复用同一登录、会话和权威模拟路径。
  语言职责：Go 持有 app、world、sim、network、storage 与 render 的 CPU 半部；Rust `mornlea_engine` 持有生产数值计算，Rust `mornlea_client` 持有 Darwin 窗口、事件与全部 GPU 渲染。生产路径没有 Go fallback。
  ABI 边界：只有 `internal/nativeabi` 接触 engine ABI，只有 `internal/client` 接触 client ABI；领域包通过既有 bridge 调用 Rust。
  架构约束：内部包依赖以 `internal/archcheck/dependency_test.go` 为准，任何 Go 包不得导入 WebGPU 绑定。跨 goroutine 发送成功后的消息及其 slice 视为不可变；权威 tick、渲染和网络热路径不得执行无界工作或阻塞 I/O。
  资源边界：不得加入 Mojang 版权材质或其他未经授权的二进制美术资源；不得放宽真实 overflow、数据丢失、报告身份或 I/O 错误门禁。
  权威入口：当前行为以代码、测试和 `openspec/specs/` 为准；当前架构见 `docs/architecture.md`，文档地图见 `docs/README.md`，实现编年史见 `docs/notes/progress.md`。`docs/superpowers/` 与归档 change 只作历史证据。

rules:
  proposal:
    - 使用中文撰写，明确背景、目标、非目标、用户可观察结果和受影响的包或文档
    - 把变更限制为一个可独立评审、验证和回退的最小闭环
    - 明确兼容性、存档、协议、并发或性能影响；不适用时直接说明
  specs:
    - 使用中文描述可观察行为，并保留 OpenSpec 要求的英文结构标题和 SHALL/MUST 关键字
    - 每条 Requirement 至少包含一个可判定的 Given/When/Then Scenario，并覆盖重要失败路径或边界条件
    - 只写行为契约；包结构、类型选择和实现步骤放入 design.md
  design:
    - 说明数据所有权、依赖方向、并发边界以及受影响文件；不得绕过现有架构门禁
    - 涉及存档、线上协议或性能契约时，包含兼容/迁移方案、风险、回退方案和验证方法
    - 对重要取舍记录被否决的替代方案及理由
  tasks:
    - 拆成按顺序执行、可单独验证、可勾选的小任务；测试与对应实现放在同一任务组
    - 每项写明目标文件或包以及具体验证命令，避免“完成开发”一类不可判定描述
    - 收尾任务必须包含 gofmt、go vet ./...、go test ./... -race 和 OpenSpec 严格校验；平台专属或性能变更补充相应门禁

operations:
  apply:
    guidance:
      - 实现前重新读取 proposal、delta specs、design 和 tasks，以这些产物约束范围
      - 遵循 red-green-refactor，保留用户已有和无关的工作区改动，只在验证通过后勾选任务
      - 实现发现规格或设计不成立时，先同步修改对应 OpenSpec 产物，再继续编码
      - change 的实现必须以 `subagent-driven-development` skill 执行：一轮开发一轮审查（任务 brief 为唯一需求来源，评审与修复循环定义以 skill 为准），收尾做整分支终审；进度、评审结论与裁决记录在 ledger，控制会话不得绕过子代理直接实现
  archive:
    guidance:
      - 归档前确认任务状态、实现与 delta specs 一致，并运行 openspec validate --all --strict --no-interactive
      - 把可复用的行为契约合入主规格；项目级工作习惯应更新 AGENTS.md 或 openspec/config.yaml
      - 必要时更新根 AGENTS.md 当前版本矩阵，并更新对应主规格或 docs/notes/progress.md（版本号由 internal/archcheck 的 TestBaselineVersionsMatchCode 兜底）；CLAUDE.md 只保留 shim
