[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[project]
name = "mornlea-companion-agent"
version = "0.1.0"
description = "Mornlea companion Agent service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.22.1,<1",
  "fastapi>=0.136.1,<1",
  "httpx>=0.28.1,<1",
  "idna>=3.11,<4",
  "langchain>=1.3.14,<2",
  "langchain-mcp-adapters>=0.2.2,<1",
  "langchain-openai>=1.2.1,<2",
  "langgraph>=1.2.9,<2",
  "mcp>=1.28.1,<2",
  "pydantic>=2.12.5,<3",
  "pyyaml>=6.0.3,<7",
  "uvicorn>=0.41.0,<1",
]

[project.scripts]
mornlea-companion-agent = "mornlea_companion_agent.cli:entrypoint"

[dependency-groups]
dev = [
  "mypy>=1.19.1,<2",
  "pytest>=9.0.2,<10",
  "ruff>=0.15.6,<1",
  "types-pyyaml>=6.0.12.20250915,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mornlea_companion_agent"]

[tool.hatch.build.targets.wheel.force-include]
"../../../packages/contracts/companion-agent/mcp-v1/manifest.json" = "mornlea_companion_agent/_contracts/mcp-v1/manifest.json"
"../../../packages/contracts/companion-agent/mcp-v1/schema.json" = "mornlea_companion_agent/_contracts/mcp-v1/schema.json"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mornlea_companion_agent"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
